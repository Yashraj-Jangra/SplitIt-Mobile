plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'expo.modules.embeddedphotopicker'
version = '1.0.0'

android {
  namespace "expo.modules.embeddedphotopicker"
  defaultConfig {
    versionCode 1
    versionName '1.0.0'
  }
  kotlinOptions {
    freeCompilerArgs += [
      "-opt-in=androidx.photopicker.embedded.ExperimentalPhotoPickerApi"
    ]
  }
}

dependencies {
  implementation "androidx.core:core-ktx:1.17.0"
  implementation "androidx.photopicker:photopicker-embedded:1.0.0-alpha03"
}
